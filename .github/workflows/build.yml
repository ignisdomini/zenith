name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Cache catalog sources
        uses: actions/cache@v4
        with:
          path: data
          key: catalog-sources-hyg41-tycho2-v1

      - name: Build star catalog
        run: npm run catalog

      - name: Verify astronomy math
        run: npm run verify

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: zenit-windows
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zenit-setup-*.exe
            dist/zenit-portable-*.exe
          generate_release_notes: true
